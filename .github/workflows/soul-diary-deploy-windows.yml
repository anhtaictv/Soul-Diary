name: Deploy (VPS via PM2)

# Tu dong khi push vao master, hoac bam tay tu tab Actions khi can.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

env:
  # Runner service khong chay duoi user Administrator, nhung PM2 daemon dang
  # chay (souldiary-api) lai thuoc PM2_HOME cua Administrator. Tro thang toi
  # do de pm2 stop/restart trong job nay noi dung voi dung daemon.
  PM2_HOME: C:\Users\Administrator\.pm2

jobs:
  deploy:
    runs-on: [self-hosted, souldiary-vps]
    environment: production
    steps:
      # Checkout vào workspace riêng của runner (không phải thẳng vào nhat-ky-fullstack).
      - uses: actions/checkout@v4

      - name: Sync code into place
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "C:\Users\Administrator\Desktop\nhat-ky-fullstack\backend"

          # Xoá trước từng entry cùng tên ở đích (không đụng .env hay node_modules —
          # 2 thứ đó không nằm trong git repo nên không có trong danh sách $source).
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem "backend" -Name | ForEach-Object {
            $target = Join-Path $dest $_
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          }
          Copy-Item -Path "backend\*" -Destination $dest -Recurse -Force

      - name: Install deps, migrate, restart via pm2
        shell: powershell
        working-directory: C:\Users\Administrator\Desktop\nhat-ky-fullstack\backend
        run: |
          $ErrorActionPreference = "Stop"

          # Service chay LocalSystem, khong co PATH cua user Administrator — pm2
          # global chi nam trong AppData\Roaming\npm cua Administrator, khong o
          # PATH may chu (khac voi node/npm o Program Files da san co tren PATH).
          $env:Path = "C:\Users\Administrator\AppData\Roaming\npm;$env:Path"

          # pm2 stop trước khi npm ci — process đang chạy giữ file .node/native addon
          # đang dùng, unlink sẽ lỗi EPERM.
          pm2 stop souldiary-api

          npm ci --omit=dev

          pm2 restart souldiary-api
          pm2 save

      - name: Sync frontend into IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "C:\inetpub\wwwroot\souldiary"

          # IIS phuc vu file tinh truc tiep tu dia, khong can recycle app pool
          # sau khi thay noi dung — sync xong la ap dung ngay cho request tiep theo.
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem "frontend" -Name | ForEach-Object {
            $target = Join-Path $dest $_
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          }
          Copy-Item -Path "frontend\*" -Destination $dest -Recurse -Force
